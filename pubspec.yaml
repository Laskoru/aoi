name: aoi
description: "Application de gestion de bassin et suivi de carpes Koi."
publish_to: 'none'

version: 2.0.1+9

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:      # Interface et sélecteur de date en français
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  fl_chart: ^1.2.0         # Pour les graphiques
  shared_preferences: ^2.2.2 # Pour la sauvegarde
  firebase_core: ^4.9.0       # Obligatoire pour Firebase
  cloud_firestore: ^6.4.1     # La base de données Cloud
  firebase_auth: ^6.5.1      # Ajout pour l'auth
  google_sign_in: 7.2.0     # Ajout pour Google
  image_picker: ^1.1.2       # Ajoute cette ligne
  firebase_storage: ^13.4.1
  go_router: ^18.0.1          # Routes, deep links PWA, onglets à état préservé
  http: ^1.6.0                # Photos des données de démonstration (debug)
  image: ^4.5.0               # Recompression des photos trop lourdes pour Firestore
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Icônes de lancement, générées depuis assets/icon/ :
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    background_color: "#F8F5F0"
    theme_color: "#F8F5F0"
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#14425A"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  # Le koï est déjà dessiné dans la zone sûre (56 % du calque) : pas de
  # marge supplémentaire, sinon il rapetisse une seconde fois.
  adaptive_icon_foreground_inset: 0
  # Silhouette seule, pour les icônes thématiques d'Android 13 et plus.
  adaptive_icon_monochrome: "assets/icon/monochrome.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  # Traductions : génère AppLocalizations depuis lib/l10n (voir l10n.yaml).
  generate: true

  # Eau animée de la scène du bassin. Compilé pour chaque plateforme au
  # build ; un repli peint à la main prend le relais s'il ne charge pas.
  shaders:
    - shaders/pond_water.frag

  # Si vous souhaitez ajouter des images de carpes plus tard, 
  # vous devrez décommenter et configurer cette section :
  # assets:
  #   - assets/images/