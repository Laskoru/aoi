name: aoi
description: "Application de gestion de bassin et suivi de carpes Koi."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  fl_chart: ^0.66.0         # Pour les graphiques
  shared_preferences: ^2.2.2 # Pour la sauvegarde
  firebase_core: ^3.1.1       # Obligatoire pour Firebase
  cloud_firestore: ^5.0.2     # La base de données Cloud
  firebase_auth: ^5.1.1      # Ajout pour l'auth
  google_sign_in: ^6.2.1     # Ajout pour Google
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Si vous souhaitez ajouter des images de carpes plus tard, 
  # vous devrez décommenter et configurer cette section :
  # assets:
  #   - assets/images/