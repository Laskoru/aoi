name: aoi
description: "Application de gestion de bassin et suivi de carpes Koi."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  fl_chart: ^1.2.0         # Pour les graphiques
  shared_preferences: ^2.2.2 # Pour la sauvegarde
  firebase_core: ^4.9.0       # Obligatoire pour Firebase
  cloud_firestore: ^6.4.1     # La base de données Cloud
  firebase_auth: ^6.5.1      # Ajout pour l'auth
  google_sign_in: 7.2.0     # Ajout pour Google
  image_picker: ^1.1.2       # Ajoute cette ligne
  firebase_storage: ^13.4.1
  google_sign_in_web: ^1.1.3
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Si vous souhaitez ajouter des images de carpes plus tard, 
  # vous devrez décommenter et configurer cette section :
  # assets:
  #   - assets/images/